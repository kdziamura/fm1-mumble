# MUMBLE, an FM-1 firmware on fm1-base: the engine's tests, the host
# simulator's tests and the fuzzer, then the device package with JieLi's Linux toolchain,
# fetched and checked against fm1-base's tools/toolchain.lock. The package is
# attached to the run as the "mumble-fm1" artifact, with the test screenshots.
name: MUMBLE firmware

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  firmware:
    runs-on: ubuntu-24.04          # the JieLi toolchain is Linux x86-64 only
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          persist-credentials: false

      - name: Cache the toolchain
        uses: actions/cache@v4
        with:
          path: |
            base/.toolchain
            base/.venv
          key: fm1-toolchain-${{ hashFiles('base/tools/toolchain.lock', 'base/uv.lock') }}

      - name: JieLi toolchain, AC79 SDK files and the build's Python (pinned)
        run: |
          base/tools/setup_toolchain.sh --only jieli,ac79-sdk,uv,python
          echo "$PWD/base/.venv/bin" >> "$GITHUB_PATH"

      - name: Engine tests (tests/engine_test.c)
        run: tests/engine.sh app/build/engine

      - name: Host simulator tests
        run: |
          python3 base/tools/build.py app --host
          app/build/host/mumble_host app/tests/basic.txt app/build/host
          app/build/host/mumble_host app/tests/record.txt app/build/host
          app/build/host/mumble_host app/tests/line.txt app/build/host
          app/build/host/mumble_host app/tests/controls.txt app/build/host
          app/build/host/mumble_host app/tests/save.txt app/build/host
          app/build/host/mumble_host app/tests/clock.txt app/build/host

      - name: Fuzz (the seeds, two minutes, the corpus with ASan on globals; tests/fuzz.c)
        run: |
          sudo apt-get install -y --no-install-recommends libclang-rt-18-dev
          CC=clang-18 tests/fuzz.sh --replay tests/fuzz-seeds/*
          # (libFuzzer's line a new input goes to the log, attached below; the step shows the end)
          # (a failure: shrunk, and printed as the panel actions that make it)
          CC=clang-18 tests/fuzz.sh -max_total_time=120 -print_final_stats=1 > app/build/fuzz/fuzz.log 2>&1 \
            || { tail -n 30 app/build/fuzz/fuzz.log
                 for f in app/build/fuzz/crashes/*; do CC=clang-18 tests/fuzz.sh --minimize "$f"; break; done
                 exit 1; }
          grep -E '^(stat::|Done )' app/build/fuzz/fuzz.log
          CC=clang-18 tests/fuzz.sh --replay

      - name: Firmware
        run: |
          python3 base/tools/build.py app
          ls -l app/build/*.fwsc
          sha256sum app/build/*.fwsc | tee app/build/SHA256SUMS.txt
          echo "### MUMBLE firmware" >> "$GITHUB_STEP_SUMMARY"
          sed 's/^/    /' app/build/SHA256SUMS.txt >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mumble-fm1
          path: |
            app/build/*.fwsc
            app/build/*.bin
            app/build/SHA256SUMS.txt
            app/build/host/*.png
            app/build/host/*.wav
            app/build/fuzz/crashes/
            app/build/fuzz/fuzz.log
            app/build/engine/*.wav
          if-no-files-found: warn
